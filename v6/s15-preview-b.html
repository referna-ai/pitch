<!DOCTYPE html>

<style>
body[data-slide="slide-15"] .slide-title { margin-bottom: 4px; }

.s15-sub {
  font-family: var(--font-body);
  font-size: 17px;
  color: var(--gray-mid);
  margin-bottom: 4px;
}

.s15-tabs {
  display: flex;
  gap: 28px;
  margin-bottom: 4px;
}
input[name="circle-tab"] { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
.s15-tabs label {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--gray-dark);
  cursor: pointer;
  padding-bottom: 8px;
  border-bottom: 2px solid transparent;
  transition: color 0.2s ease, border-color 0.2s ease;
}
#tab-reloc:checked  ~ .s15-tabs label[for="tab-reloc"],
#tab-expand:checked ~ .s15-tabs label[for="tab-expand"],
#tab-solo:checked   ~ .s15-tabs label[for="tab-solo"] {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

.s15-stage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.s15-panel { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
.s15-panel svg { width: auto; height: 100%; max-height: 460px; overflow: visible; }

#tab-reloc:checked  ~ .s15-stage #panel-reloc,
#tab-expand:checked ~ .s15-stage #panel-expand,
#tab-solo:checked   ~ .s15-stage #panel-solo { display: flex; }

.wheel-ring   { fill: none; stroke: rgba(212,165,116,0.18); stroke-width: 1.5; }
.wheel-spoke  { stroke: rgba(212,165,116,0.28); stroke-width: 1; }
.wheel-node   { fill: #1a1a1a; stroke: var(--gold); stroke-width: 1.5; }
.wheel-hub    { fill: #241e19; stroke: var(--gold); stroke-width: 2.5; }
.wheel-hub-label {
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 19px;
  fill: rgba(212,165,116,0.9);
  text-anchor: middle;
  letter-spacing: -0.01em;
}
.role-label {
  font-family: 'Manrope', sans-serif;
  font-weight: 600;
  font-size: 15px;
  fill: var(--gray);
}
</style>
</head>
